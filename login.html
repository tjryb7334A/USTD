<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title id="pageTitle">CryptoYield - تسجيل الدخول وإنشاء الحساب</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#070A0F',
                        cardBg: '#0F151E',
                        accentBlue: '#00D1FF',
                        accentGreen: '#00FF66',
                        accentGold: '#FFD700',
                        accentPurple: '#A855F7',
                        accentRed: '#EF4444'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ====== الإعدادات الأساسية ====== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Tajawal', 'Inter', sans-serif;
            background: #070A0F;
            overflow-x: hidden;
            min-height: 100vh;
            width: 100%;
            max-width: 100vw;
            position: relative;
        }

        /* ====== منع السكرول الأفقي ====== */
        .no-horizontal-scroll {
            overflow-x: hidden !important;
            max-width: 100vw !important;
        }

        /* ====== خلفية متطورة مع أنيميشن ====== */
        .cyber-bg {
            background-color: #070A0F;
            background-image: 
                radial-gradient(ellipse at 20% 30%, rgba(0, 209, 255, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(0, 255, 102, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(168, 85, 247, 0.06) 0%, transparent 40%),
                radial-gradient(ellipse at 10% 80%, rgba(255, 215, 0, 0.04) 0%, transparent 30%);
            background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%;
            position: relative;
            min-height: 100vh;
            width: 100%;
        }

        /* ====== جزيئات متحركة (النجوم) ====== */
        .cyber-bg::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(2px 2px at 10% 20%, rgba(255,255,255,0.4), transparent),
                radial-gradient(2px 2px at 30% 60%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1.5px 1.5px at 50% 10%, rgba(255,255,255,0.5), transparent),
                radial-gradient(2px 2px at 70% 40%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1.5px 1.5px at 90% 80%, rgba(255,255,255,0.4), transparent),
                radial-gradient(2px 2px at 15% 90%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1.5px 1.5px at 85% 15%, rgba(255,255,255,0.5), transparent),
                radial-gradient(2px 2px at 45% 85%, rgba(255,255,255,0.3), transparent);
            background-size: 100% 100%;
            pointer-events: none;
            z-index: 0;
            animation: twinkle 3s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* ====== خطوط الشبكة الخلفية ====== */
        .cyber-bg::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        /* ====== كرة متوهجة خلفية ====== */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 8s ease-in-out infinite alternate;
        }

        .glow-orb-1 {
            width: 300px;
            height: 300px;
            background: rgba(0, 209, 255, 0.15);
            top: -100px;
            right: -100px;
        }

        .glow-orb-2 {
            width: 400px;
            height: 400px;
            background: rgba(0, 255, 102, 0.1);
            bottom: -150px;
            left: -150px;
            animation-delay: 3s;
        }

        .glow-orb-3 {
            width: 200px;
            height: 200px;
            background: rgba(168, 85, 247, 0.1);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 5s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -20px) scale(1.1); }
            66% { transform: translate(-20px, 30px) scale(0.9); }
            100% { transform: translate(10px, -10px) scale(1.05); }
        }

        /* ====== Glass Card ====== */
        .glass-card {
            background: rgba(15, 21, 30, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            position: relative;
            z-index: 1;
            width: 100%;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 24px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(0, 209, 255, 0.2), rgba(0, 255, 102, 0.1), rgba(168, 85, 247, 0.2));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* ====== أنيميشن المدخل ====== */
        @keyframes fadeSlideUp {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .animate-fade-up {
            animation: fadeSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* ====== أنيميشن الأزرار ====== */
        @keyframes pulse-btn {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 102, 0.2); }
            50% { box-shadow: 0 0 40px rgba(0, 255, 102, 0.5); }
        }
        .btn-pulse {
            animation: pulse-btn 2s ease-in-out infinite;
        }

        /* ====== إصلاح النصوص ====== */
        h1, h2, h3, p, span, a, div, button, li, input, label {
            line-height: 1.8 !important;
        }

        /* ====== تحسين المدخلات ====== */
        .input-field {
            background: rgba(7, 10, 15, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
            width: 100%;
        }
        .input-field:focus {
            border-color: #00FF66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.1);
            outline: none;
        }
        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        /* ====== علامة التبويب النشطة ====== */
        .tab-active {
            background: linear-gradient(135deg, #00FF66, #00D1FF);
            color: #070A0F;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.2);
        }

        /* ====== زر اللغة ====== */
        .lang-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            color: #9CA3AF;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .lang-btn:hover {
            background: rgba(0, 255, 102, 0.1);
            border-color: #00FF66;
            color: #00FF66;
        }

        /* ====== تحسين التجاوب ====== */
        @media (max-width: 480px) {
            .glass-card {
                padding: 1.25rem !important;
                border-radius: 20px;
            }
            .tab-active, .tab-btn {
                font-size: 11px !important;
                padding: 8px 0 !important;
            }
            .input-field {
                font-size: 13px !important;
                padding: 10px 36px 10px 12px !important;
            }
            .lang-btn {
                font-size: 10px;
                padding: 4px 10px;
            }
            .logo-text {
                font-size: 14px !important;
            }
            .logo-icon {
                width: 30px !important;
                height: 30px !important;
                font-size: 12px !important;
            }
            footer p {
                font-size: 9px !important;
            }
        }

        @media (min-width: 481px) and (max-width: 768px) {
            .glass-card {
                padding: 1.75rem !important;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .glass-card {
                padding: 2rem !important;
            }
        }

        /* ====== تحسين السكرول ====== */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #070A0F;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #00FF66, #00D1FF);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00FF66;
        }

        .container-auth {
            width: 100%;
            max-width: 100%;
            padding-left: 12px;
            padding-right: 12px;
        }

        @media (min-width: 640px) {
            .container-auth {
                padding-left: 24px;
                padding-right: 24px;
            }
        }

        @media (min-width: 1024px) {
            .container-auth {
                padding-left: 32px;
                padding-right: 32px;
            }
        }

        ::selection {
            background-color: #1111; 
            color:rgba(0, 255, 102, 0.3);            
}
    </style>
</head>

    <!-- ====== JAVASCRIPT ====== -->
    <script>
        // ====== متغير اللغة ======
        let currentLang = localStorage.getItem('siteLang') || 'ar';

        // ====== تطبيق اللغة المحفوظة ======
        function applyLanguage() {
            const htmlRoot = document.getElementById('htmlRoot');
            htmlRoot.setAttribute('lang', currentLang);
            htmlRoot.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            
            document.getElementById('langText').innerText = currentLang === 'ar' ? 'EN' : 'AR';
            
            // تحديث جميع النصوص
            document.querySelectorAll('[data-ar]').forEach(el => {
                const text = el.getAttribute(`data-${currentLang}`);
                if (text) {
                    el.innerText = text;
                }
            });
        }

        // ====== تبديل اللغة ======
        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            localStorage.setItem('siteLang', currentLang);
            applyLanguage();
        }

        // ====== تبديل التبويبات ======
        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginBtn = document.getElementById('loginTabBtn');
            const registerBtn = document.getElementById('registerTabBtn');

            if(tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginBtn.className = "tab-active flex-1 py-2.5 sm:py-3 rounded-xl text-[11px] sm:text-sm font-bold transition tab-btn";
                registerBtn.className = "flex-1 py-2.5 sm:py-3 rounded-xl text-[11px] sm:text-sm font-bold transition text-gray-400 hover:text-white tab-btn";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                registerBtn.className = "tab-active flex-1 py-2.5 sm:py-3 rounded-xl text-[11px] sm:text-sm font-bold transition tab-btn";
                loginBtn.className = "flex-1 py-2.5 sm:py-3 rounded-xl text-[11px] sm:text-sm font-bold transition text-gray-400 hover:text-white tab-btn";
            }
        }

        // ====== إظهار/إخفاء كلمة المرور ======
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.parentElement.querySelector('.fa-regular');
            
            if(input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-regular fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fa-regular fa-eye';
            }
        }

        // ====== التحقق من تطابق كلمة المرور ======
        function checkPasswordMatch() {
            const password = document.getElementById('registerPassword').value;
            const confirm = document.getElementById('registerConfirmPassword').value;
            const errorEl = document.getElementById('passwordMatchError');
            
            if(password && confirm && password !== confirm) {
                errorEl.classList.remove('hidden');
                return false;
            } else {
                errorEl.classList.add('hidden');
                return true;
            }
        }

        // ====== معالجة تسجيل الدخول ======
        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if(!username || !password) {
                alert(currentLang === 'ar' ? '⚠️ يرجى ملء جميع الحقول' : '⚠️ Please fill all fields');
                return;
            }

            alert(currentLang === 'ar' ? '✅ مرحباً ' + username + '! تم تسجيل الدخول بنجاح.' : '✅ Welcome ' + username + '! Login successful.');
        }

        // ====== معالجة إنشاء الحساب ======
        function handleRegister(e) {
            e.preventDefault();
            
            const username = document.getElementById('registerUsername').value.trim();
            const password = document.getElementById('registerPassword').value;
            const confirm = document.getElementById('registerConfirmPassword').value;

            if(!username || !password || !confirm) {
                alert(currentLang === 'ar' ? '⚠️ يرجى ملء جميع الحقول' : '⚠️ Please fill all fields');
                return;
            }

            if(username.length < 3) {
                alert(currentLang === 'ar' ? '⚠️ اسم المستخدم يجب أن يكون 3 أحرف على الأقل' : '⚠️ Username must be at least 3 characters');
                return;
            }

            if(!checkPasswordMatch()) {
                alert(currentLang === 'ar' ? '⚠️ كلمة المرور وتأكيدها غير متطابقين' : '⚠️ Passwords do not match');
                return;
            }

            if(password.length < 6) {
                alert(currentLang === 'ar' ? '⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل' : '⚠️ Password must be at least 6 characters');
                return;
            }

            alert(currentLang === 'ar' ? '✅ تم إنشاء الحساب بنجاح! مرحباً ' + username : '✅ Account created successfully! Welcome ' + username);
            
            // التبديل إلى تبويب تسجيل الدخول
            switchTab('login');
            
            // تنظيف الحقول
            document.getElementById('loginUsername').value = username;
            document.getElementById('loginPassword').value = '';
            document.getElementById('registerUsername').value = '';
            document.getElementById('registerPassword').value = '';
            document.getElementById('registerConfirmPassword').value = '';
        }

        // ====== تحميل الصفحة ======
        document.addEventListener('DOMContentLoaded', function() {
            // تطبيق اللغة المحفوظة
            applyLanguage();
            
            // التحقق من تطابق كلمة المرور
            const password = document.getElementById('registerPassword');
            const confirm = document.getElementById('registerConfirmPassword');
            
            if(password && confirm) {
                password.addEventListener('input', checkPasswordMatch);
                confirm.addEventListener('input', checkPasswordMatch);
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title id="pageTitle">CryptoYield - تسجيل الدخول وإنشاء الحساب</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#070A0F',
                        cardBg: '#0F151E',
                        accentBlue: '#00D1FF',
                        accentGreen: '#00FF66',
                        accentGold: '#FFD700',
                        accentPurple: '#A855F7',
                        accentRed: '#EF4444'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ====== الإعدادات الأساسية ====== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            overflow-x: hidden;
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            font-family: 'Tajawal', 'Inter', sans-serif;
            background: #070A0F;
            overflow-x: hidden;
            min-height: 100vh;
            width: 100%;
            max-width: 100vw;
            position: relative;
        }

        /* ====== خلفية مبسطة وسريعة ====== */
        .cyber-bg {
            background-color: #070A0F;
            background-image: 
                radial-gradient(ellipse at 20% 30%, rgba(0, 209, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(0, 255, 102, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(168, 85, 247, 0.04) 0%, transparent 40%);
            background-size: 100% 100%, 100% 100%, 100% 100%;
            position: relative;
            min-height: 100vh;
            width: 100%;
        }

        /* ====== نجوم بسيطة بدون أنيميشن ثقيل ====== */
        .cyber-bg::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(1.5px 1.5px at 10% 20%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1.5px 1.5px at 30% 60%, rgba(255,255,255,0.2), transparent),
                radial-gradient(1px 1px at 50% 10%, rgba(255,255,255,0.4), transparent),
                radial-gradient(1.5px 1.5px at 70% 40%, rgba(255,255,255,0.2), transparent),
                radial-gradient(1px 1px at 90% 80%, rgba(255,255,255,0.3), transparent);
            background-size: 100% 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* ====== كرات خلفية بسيطة ====== */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            pointer-events: none;
            z-index: 0;
        }

        .glow-orb-1 {
            width: 200px;
            height: 200px;
            background: rgba(0, 209, 255, 0.1);
            top: -50px;
            right: -50px;
        }

        .glow-orb-2 {
            width: 300px;
            height: 300px;
            background: rgba(0, 255, 102, 0.07);
            bottom: -100px;
            left: -100px;
        }

        /* ====== Glass Card ====== */
        .glass-card {
            background: rgba(15, 21, 30, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.6);
            position: relative;
            z-index: 1;
            width: 100%;
            transition: all 0.3s ease;
        }

        /* ====== أنيميشن خفيف ====== */
        @keyframes fadeSlideUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-up {
            animation: fadeSlideUp 0.5s ease-out forwards;
        }

        /* ====== تحسين المدخلات ====== */
        .input-field {
            background: rgba(7, 10, 15, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s ease;
            width: 100%;
            font-size: 1rem !important;
            padding: 0.75rem 2.75rem 0.75rem 1rem !important;
            border-radius: 12px;
            color: #fff;
        }
        .input-field:focus {
            border-color: #00FF66;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.08);
            outline: none;
        }
        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        /* ====== علامة التبويب ====== */
        .tab-active {
            background: linear-gradient(135deg, #00FF66, #00D1FF);
            color: #070A0F;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.15);
        }

        .tab-btn {
            transition: all 0.2s ease;
            font-size: 0.85rem !important;
            padding: 0.65rem 0 !important;
        }

        /* ====== زر اللغة ====== */
        .lang-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.2s ease;
            padding: 0.4rem 0.8rem;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #9CA3AF;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .lang-btn:hover {
            background: rgba(0, 255, 102, 0.08);
            border-color: #00FF66;
            color: #00FF66;
        }

        /* ====== تحسين النصوص ====== */
        h1, h2, h3, p, span, a, div, button, li, input, label {
            line-height: 1.6 !important;
        }

        label {
            font-size: 0.8rem !important;
        }

        /* ====== تحسين التجاوب الكامل ====== */
        /* هواتف صغيرة جداً */
        @media (max-width: 380px) {
            html { font-size: 14px; }
            .glass-card { padding: 1rem !important; border-radius: 16px; }
            .tab-btn { font-size: 0.7rem !important; padding: 0.5rem 0 !important; }
            .input-field { font-size: 0.85rem !important; padding: 0.6rem 2.2rem 0.6rem 0.8rem !important; }
            .logo-text { font-size: 0.9rem !important; }
            .logo-icon { width: 28px !important; height: 28px !important; font-size: 0.7rem !important; }
            .lang-btn { font-size: 0.6rem; padding: 0.3rem 0.6rem; }
            .btn-text { font-size: 0.75rem !important; }
        }

        /* هواتف */
        @media (min-width: 381px) and (max-width: 480px) {
            html { font-size: 15px; }
            .glass-card { padding: 1.25rem !important; border-radius: 18px; }
            .tab-btn { font-size: 0.75rem !important; padding: 0.55rem 0 !important; }
            .input-field { font-size: 0.9rem !important; padding: 0.65rem 2.5rem 0.65rem 0.9rem !important; }
            .logo-text { font-size: 1rem !important; }
            .logo-icon { width: 32px !important; height: 32px !important; font-size: 0.8rem !important; }
        }

        /* هواتف كبيرة وأجهزة لوحية صغيرة */
        @media (min-width: 481px) and (max-width: 768px) {
            html { font-size: 16px; }
            .glass-card { padding: 1.75rem !important; }
            .tab-btn { font-size: 0.8rem !important; }
            .input-field { font-size: 0.95rem !important; }
        }

        /* أجهزة لوحية */
        @media (min-width: 769px) and (max-width: 1024px) {
            .glass-card { padding: 2rem !important; }
        }

        /* شاشات كبيرة */
        @media (min-width: 1025px) {
            .glass-card { padding: 2.5rem !important; }
            .input-field { font-size: 1rem !important; padding: 0.85rem 3rem 0.85rem 1.2rem !important; }
            .tab-btn { font-size: 0.9rem !important; padding: 0.75rem 0 !important; }
        }

        /* ====== سكرول جميل ====== */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #070A0F; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #00FF66, #00D1FF); border-radius: 10px; }

        /* ====== حاوية ====== */
        .container-auth {
            width: 100%;
            max-width: 100%;
            padding-left: 0.75rem;
            padding-right: 0.75rem;
        }

        @media (min-width: 640px) {
            .container-auth {
                padding-left: 1.5rem;
                padding-right: 1.5rem;
            }
        }

        /* ====== تحديد النص ====== */
        ::selection {
            background: rgba(0, 255, 102, 0.2);
            color: #fff;
        }

        /* ====== تحسين الأزرار ====== */
        .btn-primary {
            transition: all 0.2s ease;
            font-size: 0.85rem !important;
            padding: 0.75rem 1.5rem !important;
            border-radius: 12px;
        }

        @media (max-width: 480px) {
            .btn-primary {
                font-size: 0.75rem !important;
                padding: 0.65rem 1rem !important;
            }
        }

        /* ====== تباعد العناصر ====== */
        .form-spacing {
            gap: 0.75rem;
        }

        @media (min-width: 640px) {
            .form-spacing {
                gap: 1rem;
            }
        }

        /* ====== تحسين الأيقونات ====== */
        .icon-input {
            font-size: 0.85rem;
        }

        @media (max-width: 480px) {
            .icon-input {
                font-size: 0.75rem;
            }
        }
    </style>
</head>

    <!-- ====== JAVASCRIPT ====== -->
    <script>
        // ====== متغير اللغة ======
        let currentLang = localStorage.getItem('siteLang') || 'ar';

        // ====== تطبيق اللغة المحفوظة ======
        function applyLanguage() {
            const htmlRoot = document.getElementById('htmlRoot');
            htmlRoot.setAttribute('lang', currentLang);
            htmlRoot.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            
            document.getElementById('langText').innerText = currentLang === 'ar' ? 'EN' : 'AR';
            
            document.querySelectorAll('[data-ar]').forEach(el => {
                const text = el.getAttribute(`data-${currentLang}`);
                if (text) {
                    el.innerText = text;
                }
            });
        }

        // ====== تبديل اللغة ======
        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            localStorage.setItem('siteLang', currentLang);
            applyLanguage();
        }

        // ====== تبديل التبويبات ======
        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginBtn = document.getElementById('loginTabBtn');
            const registerBtn = document.getElementById('registerTabBtn');

            if(tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginBtn.className = "tab-active flex-1 py-2 sm:py-2.5 rounded-lg text-xs sm:text-sm font-bold transition tab-btn";
                registerBtn.className = "flex-1 py-2 sm:py-2.5 rounded-lg text-xs sm:text-sm font-bold transition text-gray-400 hover:text-white tab-btn";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                registerBtn.className = "tab-active flex-1 py-2 sm:py-2.5 rounded-lg text-xs sm:text-sm font-bold transition tab-btn";
                loginBtn.className = "flex-1 py-2 sm:py-2.5 rounded-lg text-xs sm:text-sm font-bold transition text-gray-400 hover:text-white tab-btn";
            }
        }

        // ====== إظهار/إخفاء كلمة المرور ======
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.parentElement.querySelector('.fa-regular');
            
            if(input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-regular fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fa-regular fa-eye';
            }
        }

        // ====== التحقق من تطابق كلمة المرور ======
        function checkPasswordMatch() {
            const password = document.getElementById('registerPassword').value;
            const confirm = document.getElementById('registerConfirmPassword').value;
            const errorEl = document.getElementById('passwordMatchError');
            
            if(password && confirm && password !== confirm) {
                errorEl.classList.remove('hidden');
                return false;
            } else {
                errorEl.classList.add('hidden');
                return true;
            }
        }

        // ====== معالجة تسجيل الدخول ======
        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if(!username || !password) {
                alert(currentLang === 'ar' ? '⚠️ يرجى ملء جميع الحقول' : '⚠️ Please fill all fields');
                return;
            }

            alert(currentLang === 'ar' ? '✅ مرحباً ' + username + '! تم تسجيل الدخول بنجاح.' : '✅ Welcome ' + username + '! Login successful.');
        }

        // ====== معالجة إنشاء الحساب ======
        function handleRegister(e) {
            e.preventDefault();
            
            const username = document.getElementById('registerUsername').value.trim();
            const password = document.getElementById('registerPassword').value;
            const confirm = document.getElementById('registerConfirmPassword').value;

            if(!username || !password || !confirm) {
                alert(currentLang === 'ar' ? '⚠️ يرجى ملء جميع الحقول' : '⚠️ Please fill all fields');
                return;
            }

            if(username.length < 3) {
                alert(currentLang === 'ar' ? '⚠️ اسم المستخدم يجب أن يكون 3 أحرف على الأقل' : '⚠️ Username must be at least 3 characters');
                return;
            }

            if(!checkPasswordMatch()) {
                alert(currentLang === 'ar' ? '⚠️ كلمة المرور وتأكيدها غير متطابقين' : '⚠️ Passwords do not match');
                return;
            }

            if(password.length < 6) {
                alert(currentLang === 'ar' ? '⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل' : '⚠️ Password must be at least 6 characters');
                return;
            }

            alert(currentLang === 'ar' ? '✅ تم إنشاء الحساب بنجاح! مرحباً ' + username : '✅ Account created successfully! Welcome ' + username);
            
            switchTab('login');
            document.getElementById('loginUsername').value = username;
            document.getElementById('loginPassword').value = '';
            document.getElementById('registerUsername').value = '';
            document.getElementById('registerPassword').value = '';
            document.getElementById('registerConfirmPassword').value = '';
        }

        // ====== تحميل الصفحة ======
        document.addEventListener('DOMContentLoaded', function() {
            applyLanguage();
            
            const password = document.getElementById('registerPassword');
            const confirm = document.getElementById('registerConfirmPassword');
            
            if(password && confirm) {
                password.addEventListener('input', checkPasswordMatch);
                confirm.addEventListener('input', checkPasswordMatch);
            }
        });
    </script>
</body>
</html>
